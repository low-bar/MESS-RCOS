services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mess_rcos}
      POSTGRES_USER: ${POSTGRES_USER:-mess_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Software/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
