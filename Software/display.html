<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Graph Display</title>
	<link rel="stylesheet" href="display.css">
</head>
<body>
	<section class="graph-card">
		<h1>Weekly Values</h1>
		<canvas id="graph" aria-label="Line graph of weekly values"></canvas>
	</section>
	<script>
		const canvas = document.getElementById('graph');
		const ctx = canvas.getContext('2d');
		const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
		const values = [24, 38, 31, 52, 47, 68, 61];

		function drawGraph() {
			const scale = window.devicePixelRatio || 1;
			const width = canvas.clientWidth;
			const height = canvas.clientHeight;
			canvas.width = width * scale;
			canvas.height = height * scale;
			ctx.setTransform(scale, 0, 0, scale, 0, 0);
			ctx.clearRect(0, 0, width, height);

			const pad = { top: 24, right: 24, bottom: 42, left: 44 };
			const plotWidth = width - pad.left - pad.right;
			const plotHeight = height - pad.top - pad.bottom;
			const max = 80;

			ctx.font = '12px Arial';
			ctx.fillStyle = '#667085';
			ctx.strokeStyle = '#e5e7eb';
			for (let value = 0; value <= max; value += 20) {
				const y = pad.top + plotHeight - value / max * plotHeight;
				ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
				ctx.fillText(value, 12, y + 4);
			}

			const points = values.map((value, i) => ({
				x: pad.left + i / (values.length - 1) * plotWidth,
				y: pad.top + plotHeight - value / max * plotHeight
			}));
			ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
			ctx.beginPath();
			points.forEach((point, i) => i ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y));
			ctx.stroke();
			points.forEach((point, i) => {
				ctx.fillStyle = '#2563eb'; ctx.beginPath(); ctx.arc(point.x, point.y, 5, 0, Math.PI * 2); ctx.fill();
				ctx.fillStyle = '#667085'; ctx.textAlign = 'center'; ctx.fillText(labels[i], point.x, height - 16);
			});
		}
		window.addEventListener('resize', drawGraph);
		drawGraph();
	</script>
</body>
</html>
