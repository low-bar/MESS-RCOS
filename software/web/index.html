<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Table</title>
</head>
<body>

    <h1>Prototype Table</h1>
    <p>This is a basic table which reflects the current state of the sensor data.</p>

    <select id="value-type">
        <option value="light">Light</option>
        <option value="gas">Gas</option>
        <option value="humid">Humidity</option>
        <option value="temp">Temperature</option>
    </select>
    
    <table id="data-table" border="1" cellpadding="4">
        <thead><tr>
            <th>ID</th><th>Recorded At</th><th id="value-header">Light Value</th><th>Sensor ID</th><th>Location</th>
        </tr></thead>
        <tbody></tbody>
    </table>
    <p id="status"></p>

    <script src="/table.js"></script>
</body>
</html>
